<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 03 - Box Model & Layout</title>
    <link rel="stylesheet" href="/lab02-boxmodel/styles.css" />
  </head>
  <body>
    <div class="container">
      <a href="../index.html" class="back-btn">← กลับหน้าหลัก</a>

      <h1>📦 Box Model & Layout</h1>
      <p class="subtitle">ลองทำตามภาพให้เหมือนกัน</p>

      <div class="labs-container">
        <!-- Task 1 -->
        <div class="lab-item">
          <h2>🎴 การ์ดพื้นฐาน</h2>
          <div class="demo-box">
            <div class="example-card-basic">การ์ดของฉัน</div>
          </div>
        </div>

        <!-- Task 2 -->
        <div class="lab-item">
          <h2>📋 การ์ดที่มีเงา</h2>
          <div class="demo-box">
            <div class="example-card-shadow">
              <h3>หัวข้อ</h3>
              <p>เนื้อหาในการ์ด</p>
            </div>
          </div>
        </div>

        <!-- Task 3 -->
        <div class="lab-item">
          <h2>🏷️ ป้ายสีสัน</h2>
          <div class="demo-box">
            <div class="example-badge-box">
              <span class="badge-red">สำคัญ</span>
              <span class="badge-blue">ข้อมูล</span>
              <span class="badge-green">สำเร็จ</span>
            </div>
          </div>
        </div>

        <!-- Task 4 -->
        <div class="lab-item">
          <h2>🖼️ กรอบรูป</h2>
          <div class="demo-box">
            <div class="example-image-frame"></div>
          </div>
        </div>

        <!-- Task 5 -->
        <div class="lab-item">
          <h2>💳 บัตรข้อมูล</h2>
          <div class="demo-box">
            <div class="example-info-card">
              <div class="avatar">D</div>
              <div class="info">
                <h4>ชื่อผู้ใช้</h4>
                <p>รายละเอียด</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Task 6 -->
        <div class="lab-item">
          <h2>🎯 กล่อง 3 กล่อง</h2>
          <div class="demo-box">
            <div class="example-three-boxes">
              <div class="box-1">1</div>
              <div class="box-2">2</div>
              <div class="box-3">3</div>
            </div>
          </div>
        </div>

        <!-- Task 7 -->
        <div class="lab-item">
          <h2>⚡ ปุ่มพิเศษ</h2>
          <div class="demo-box">
            <button class="example-fancy-button">คลิกที่นี่</button>
          </div>
        </div>

        <!-- Task 8 -->
        <div class="lab-item">
          <h2>🎨 การ์ดโปรไฟล์</h2>
          <div class="demo-box">
            <div class="example-profile-card">
              <div class="profile-header"></div>
              <div style="color: #8433e8" class="profile-avatar">D</div>
              <div class="profile-content">
                <h3>ชื่อของฉัน</h3>
                <p>Dev nest</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
