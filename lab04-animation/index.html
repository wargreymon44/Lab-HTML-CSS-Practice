<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 05 - Animations</title>
    <link rel="stylesheet" href="/lab04-animation/styles.css" />
  </head>
  <body>
    <div class="container">
      <a href="../index.html" class="back-btn">← กลับหน้าหลัก</a>

      <h1>✨ Animations & Transitions</h1>
      <div class="labs-container">
        <!-- Task 1: Hover เปลี่ยนสี -->
        <div class="lab-item">
          <h2>🎨 เปลี่ยนสีเมื่อ Hover</h2>
          <div class="demo-box">
            <button class="btn-1">ชี้เมาส์ที่นี่</button>
          </div>
        </div>

        <!-- Task 2: ขยายขนาด -->
        <div class="lab-item">
          <h2>🔍 ขยายขนาดเมื่อ Hover</h2>
          <div class="demo-box">
            <div class="card-1">ชี้เมาส์ที่นี่</div>
          </div>
        </div>

        <!-- Task 3: หมุน -->
        <div class="lab-item">
          <h2>🔄 หมุนรูปภาพ</h2>
          <div class="demo-box">
            <div class="circle-1">⭐</div>
          </div>
        </div>

        <!-- Task 4: เลื่อนขึ้น -->
        <div class="lab-item">
          <h2>⬆️ เลื่อนขึ้น</h2>
          <div class="demo-box">
            <div class="box-1">ชี้เมาส์ที่นี่</div>
          </div>
        </div>

        <!-- Task 5: เปลี่ยนความโปร่งใส -->
        <div class="lab-item">
          <h2>👻 เปลี่ยนความโปร่งใส</h2>
          <div class="demo-box">
            <div class="image-box-1">🎨</div>
          </div>
        </div>

        <!-- Task 6: เปลี่ยนหลายอย่างพร้อมกัน -->
        <div class="lab-item">
          <h2>🎪 เปลี่ยนหลายอย่างพร้อมกัน</h2>
          <div class="demo-box">
            <div class="multi-effect">ชี้เมาส์ที่นี่</div>
          </div>
        </div>

        <!-- Task 7: Animation หมุนไม่หยุด -->
        <div class="lab-item">
          <h2>🎡 หมุนไม่หยุด</h2>
          <div class="demo-box">
            <div class="spin-forever">🌀</div>
          </div>
        </div>

        <!-- Task 8: ปุ่มเด้งๆ -->
        <div class="lab-item">
          <h2>🎯 ปุ่มเด้งๆ</h2>
          <div class="demo-box">
            <button class="bounce-button">คลิกเลย!</button>
          </div>
        </div>
